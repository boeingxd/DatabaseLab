<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Books</title>
</head>
<body>
  <h1>Books</h1>

  <form id="form">
    <h2>Add a book</h2>
    <label>Title <input name="title" placeholder="e.g. Clean Architecture"></label>
    <label>Author <input name="author" placeholder="e.g. Robert C. Martin"></label>
    <label>Price <input name="price" type="number" step="0.01" placeholder="e.g. 750"></label>
    <label>Stock <input name="stock" type="number" min="0" step="1" placeholder="0"></label>
    <button type="submit">Add book</button>
  </form>

  <p id="message"></p>

  <h2>All books <span id="count"></span></h2>
  <ul id="list"></ul>

  <script src="main.js"></script>
</body>
</html>
