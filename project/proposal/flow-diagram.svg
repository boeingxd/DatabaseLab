<svg viewBox="0 0 1800 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="User flow diagram">
  <defs>
    <marker id="farrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c8f97"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1800" height="610" fill="#ffffff"/>

  <!-- connecting lines -->
  <g stroke="#7c8f97" stroke-width="1.3" fill="none">
    <path d="M900,70 L900,110" marker-end="url(#farrow)"/>
    <path d="M900,160 L900,220" marker-end="url(#farrow)"/>
    <path d="M900,270 L150,330" marker-end="url(#farrow)"/>
    <path d="M900,270 L775,330" marker-end="url(#farrow)"/>
    <path d="M900,270 L1525,330" marker-end="url(#farrow)"/>
    <path d="M150,380 L150,430" marker-end="url(#farrow)"/>
    <path d="M775,380 L400,430" marker-end="url(#farrow)"/>
    <path d="M775,380 L650,430" marker-end="url(#farrow)"/>
    <path d="M775,380 L900,430" marker-end="url(#farrow)"/>
    <path d="M775,380 L1150,430" marker-end="url(#farrow)"/>
    <path d="M1525,380 L1400,430" marker-end="url(#farrow)"/>
    <path d="M1525,380 L1650,430" marker-end="url(#farrow)"/>
    <path d="M400,480 L400,530" marker-end="url(#farrow)"/>
    <path d="M650,480 L650,530" marker-end="url(#farrow)"/>
    <path d="M900,480 L900,530" marker-end="url(#farrow)"/>
    <path d="M1150,480 L1150,530" marker-end="url(#farrow)"/>
    <path d="M1400,480 L1400,530" marker-end="url(#farrow)"/>
    <path d="M1650,480 L1650,530" marker-end="url(#farrow)"/>
  </g>

  <rect x="855" y="182" width="90" height="16" rx="3" fill="#ffffff"/>
  <text x="900" y="194" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#526872">valid session</text>

  <!-- action-tier boxes -->
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <rect x="790" y="20" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="900" y="50" text-anchor="middle" font-weight="600" font-size="13.5" fill="#16232C">User opens app</text>

    <rect x="790" y="110" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="900" y="140" text-anchor="middle" font-weight="600" font-size="13.5" fill="#16232C">Sign Up / Login</text>

    <rect x="790" y="220" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="900" y="250" text-anchor="middle" font-weight="600" font-size="13.5" fill="#16232C">Dashboard</text>

    <rect x="40" y="330" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="150" y="355" text-anchor="middle" font-weight="600" font-size="12.5" fill="#16232C">Browse &amp; Search</text>
    <text x="150" y="371" text-anchor="middle" font-weight="600" font-size="12.5" fill="#16232C">Courses</text>

    <rect x="665" y="330" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="775" y="360" text-anchor="middle" font-weight="600" font-size="13.5" fill="#16232C">View Course Page</text>

    <rect x="1415" y="330" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="1525" y="355" text-anchor="middle" font-weight="600" font-size="12.5" fill="#16232C">Moderation Queue</text>
    <text x="1525" y="371" text-anchor="middle" font-weight="600" font-size="12.5" fill="#16232C">(admin)</text>

    <rect x="290" y="430" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="400" y="460" text-anchor="middle" font-weight="600" font-size="13" fill="#16232C">Submit Exam Intel</text>

    <rect x="540" y="430" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="650" y="460" text-anchor="middle" font-weight="600" font-size="13" fill="#16232C">Submit Materials</text>

    <rect x="790" y="430" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="900" y="460" text-anchor="middle" font-weight="600" font-size="13" fill="#16232C">Vote</text>

    <rect x="1040" y="430" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="1150" y="460" text-anchor="middle" font-weight="600" font-size="13" fill="#16232C">Report</text>

    <rect x="1290" y="430" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="1400" y="460" text-anchor="middle" font-weight="600" font-size="13" fill="#16232C">Take Down / Restore</text>

    <rect x="1540" y="430" width="220" height="50" rx="8" fill="#DCEDEE" stroke="#1f6f78" stroke-width="1.4"/>
    <text x="1650" y="460" text-anchor="middle" font-weight="600" font-size="13" fill="#16232C">Dismiss Report</text>
  </g>

  <!-- DB-operation leaves -->
  <g font-family="IBM Plex Mono, monospace" font-style="italic">
    <rect x="40" y="430" width="220" height="50" rx="8" fill="#F4E3D6" stroke="#9A4A20" stroke-width="1.3"/>
    <text x="150" y="450" text-anchor="middle" font-size="10.5" fill="#16232C">DB: indexed SELECT</text>
    <text x="150" y="465" text-anchor="middle" font-size="10.5" fill="#16232C">on Course</text>

    <rect x="290" y="530" width="220" height="50" rx="8" fill="#F4E3D6" stroke="#9A4A20" stroke-width="1.3"/>
    <text x="400" y="550" text-anchor="middle" font-size="10.5" fill="#16232C">DB: sp_submit_content()</text>
    <text x="400" y="565" text-anchor="middle" font-size="10.5" fill="#16232C">&#8594; Content + ExamIntel</text>

    <rect x="540" y="530" width="220" height="50" rx="8" fill="#F4E3D6" stroke="#9A4A20" stroke-width="1.3"/>
    <text x="650" y="550" text-anchor="middle" font-size="10.5" fill="#16232C">DB: sp_submit_content()</text>
    <text x="650" y="565" text-anchor="middle" font-size="10.5" fill="#16232C">&#8594; Content + Materials</text>

    <rect x="790" y="530" width="220" height="50" rx="8" fill="#F4E3D6" stroke="#9A4A20" stroke-width="1.3"/>
    <text x="900" y="550" text-anchor="middle" font-size="10.5" fill="#16232C">DB: INSERT/UPDATE Vote</text>
    <text x="900" y="565" text-anchor="middle" font-size="10.5" fill="#16232C">&#8594; trigger updates score</text>

    <rect x="1040" y="530" width="220" height="50" rx="8" fill="#F4E3D6" stroke="#9A4A20" stroke-width="1.3"/>
    <text x="1150" y="550" text-anchor="middle" font-size="10.5" fill="#16232C">DB: INSERT INTO</text>
    <text x="1150" y="565" text-anchor="middle" font-size="10.5" fill="#16232C">Report</text>

    <rect x="1290" y="530" width="220" height="50" rx="8" fill="#F4E3D6" stroke="#9A4A20" stroke-width="1.3"/>
    <text x="1400" y="550" text-anchor="middle" font-size="10.5" fill="#16232C">DB: sp_moderate_content()</text>
    <text x="1400" y="565" text-anchor="middle" font-size="10.5" fill="#16232C">&#8594; soft-delete + resolve</text>

    <rect x="1540" y="530" width="220" height="50" rx="8" fill="#F4E3D6" stroke="#9A4A20" stroke-width="1.3"/>
    <text x="1650" y="550" text-anchor="middle" font-size="10.5" fill="#16232C">DB: UPDATE Report</text>
    <text x="1650" y="565" text-anchor="middle" font-size="10.5" fill="#16232C">SET resolved = 1</text>
  </g>
</svg>
