<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — SIIT Study Hub</title>
<meta name="description" content="SIIT Study Hub — a SIIT-gated archive of student-authored exam intelligence and study materials. UI/UX showcase prototype for CSS326.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--
IMPECCABLE DIRECTION CONTRACT
THESIS: A trustworthy, structured student-course archive that plays the category standard straight — clarity and craft over a themed metaphor.
OWN-WORLD: Neutral paper ground (#eef2f3), ink #16232c, one teal accent (#1f6f78 / #124047), warm white cards, subtle rule lines. IBM Plex Serif for headings, IBM Plex Sans for UI/body, IBM Plex Mono for database-procedure microcopy. Moderate radii (6–14px), restrained shadow.
STORY: A student opens it, instantly reads it as officially SIIT-scoped and trustworthy, understands a course's exam intel at a glance, and moves confidently between browsing, submitting, and reviewing.
FIRST VIEWPORT: Post-login Dashboard — persistent top nav, "Your Courses" card row, "Recently Active" list, primary "+ Submit new" action.
FORM: Canon (category standard), chosen over the rolled/pick/challenger set. Craft bar: Google Classroom / Canvas LMS. Seed 5437cbae.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
-->
<main class="authwrap">
  <div class="authcard">
    <div class="authcard__inner">
      <div class="flex gap-2 mb-6" style="justify-content:center;">
        <svg class="icon" style="width:26px;height:26px;color:var(--accent)" viewBox="0 0 20 20"><path d="M10 3l7 3.5L10 10 3 6.5 10 3z"/><path d="M3 10l7 3.5 7-3.5"/><path d="M3 13.5l7 3.5 7-3.5"/></svg>
        <span style="font-family:var(--font-serif);font-weight:600;font-size:19px;">SIIT Study Hub</span>
      </div>

      <nav class="auth-tabs" aria-label="Auth mode">
        <a href="#" aria-current="page" id="tab-login">Log in</a>
        <a href="#" id="tab-signup">Sign up</a>
      </nav>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">SIIT email</label>
          <input class="input" type="email" id="email" name="email" placeholder="handle@g.siit.tu.ac.th" required autocomplete="username">
          <span class="hint">Domain-verified — must end in <span class="mono">@g.siit.tu.ac.th</span></span>
        </div>
        <div class="field" id="signup-fields" hidden>
          <label for="handle">Handle</label>
          <input class="input" type="text" id="handle" name="handle" placeholder="anon_handle_07" autocomplete="off">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          Log in
        </button>
        <div class="db-note mt-3">
          <svg class="icon" viewBox="0 0 20 20"><path d="M10 3l7 3.5L10 10 3 6.5 10 3z"/><path d="M3 10l7 3.5 7-3.5"/></svg>
          <span id="db-note-text">CALL sp_register_user(email, handle, password) — salts, hashes, and inserts the row.</span>
        </div>
      </form>

      <p class="text-sm muted mt-6" style="text-align:center;">
        New here? <a href="#" id="switch-to-signup">Create an account</a> instead.
      </p>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  (function () {
    var tabLogin = document.getElementById("tab-login");
    var tabSignup = document.getElementById("tab-signup");
    var signupFields = document.getElementById("signup-fields");
    var submitBtn = document.getElementById("submit-btn");
    var dbNote = document.getElementById("db-note-text");
    var switchLink = document.getElementById("switch-to-signup");

    function setMode(signup) {
      tabLogin.setAttribute("aria-current", signup ? "false" : "page");
      tabSignup.setAttribute("aria-current", signup ? "page" : "false");
      signupFields.hidden = !signup;
      submitBtn.textContent = signup ? "Create account" : "Log in";
      dbNote.textContent = signup
        ? "CALL sp_register_user(email, handle, password) — salts, hashes, and inserts the row."
        : "Verifies credentials against the stored password_hash + salt.";
    }
    tabLogin.addEventListener("click", function (e) { e.preventDefault(); setMode(false); });
    tabSignup.addEventListener("click", function (e) { e.preventDefault(); setMode(true); });
    switchLink.addEventListener("click", function (e) { e.preventDefault(); setMode(true); });

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      window.location.href = "dashboard.html";
    });
  })();
</script>
</body>
</html>
